<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="main">
        <div class="logo">
            <img src="assets/logo.jpeg" alt="logo" width="100%">
        </div>
        <div class="card">
            <h2>Create Your Account</h2>
            <form action="" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Enter First Name</label>
                    <input type="text" name="" placeholder="Enter First name">
                </div>
                <div class="form-group">
                    <label>Enter Last Name</label>
                    <input type="text" name="" placeholder="Enter Last name">
                </div>
                <div class="form-group">
                    <label>Enter Email</label>
                    <input type="email" name="" placeholder="Enter Email">
                </div>
                <div class="form-group">
                    <label>Enter Password</label>
                    <input type="password" name="" placeholder="Enter Password">
                </div>
                    <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="" placeholder="Confirm Password">
                </div>
                <button class="btn-primary">Create Account</button>
                <button class="btn-register"><a href="index.html">Have an account? Login</a></button>
            </form>
        </div>
    </div>

</body>
</html>
