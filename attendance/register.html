<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div class="main">
        <div class="logo">
            <img src="assets/logo.jpeg" alt="logo" width="100%">
        </div>
        <div class="card">
            <h2>Create Your Account</h2>
                <div class="form-group">
                    <label>Enter First Name</label>
                    <input type="text" name="" placeholder="Enter First name" id="txtfname">
                </div>
                <div class="form-group">
                    <label>Enter Last Name</label>
                    <input type="text" name="" placeholder="Enter Last name" id="txtlname">
                </div>
                <div class="form-group">
                    <label>Enter Email</label>
                    <input type="email" name="" placeholder="Enter Email" id="txtemail">
                </div>
                <div class="form-group">
                    <label>Enter Password</label>
                    <input type="password" name="" placeholder="Enter Password" id="txtpass">
                </div>
                    <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="" placeholder="Confirm Password" id="txtconpass">
                </div>
                <button class="btn-primary" id="btnCreate">Create Account</button>
                <button class="btn-register"><a href="index.html">Have an account? Login</a></button>

        </div>
    </div>

    
    <script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.16.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.2.5/firebase-auth.js"></script>
    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
